[package]
edition      = "2024"
name         = "iot-esp32c3"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "iot-esp32c3"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["defmt", "esp32c3", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
] }

defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32c3"] }

embassy-net = { version = "0.9.1", features = [
  "defmt",
  "dhcpv4",
  "dns",
  "tcp",
  "udp",
] }
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
esp-alloc = { version = "0.11.0", features = ["defmt", "esp32c3"] }
esp-backtrace = { version = "0.20.0", features = [
  "defmt",
  "esp32c3",
  "panic-handler",
] }
esp-println = { version = "0.18.0", features = ["defmt-espflash", "esp32c3"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "defmt",
  "esp-alloc",
  "esp32c3",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "defmt",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
heapless = { version = "0.9.3", default-features = false, features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
minimq = { version = "0.13.5", features = ["defmt"] }
scd4x = { version = "0.6.0", features = ["defmt", "embedded-hal-async"] }
sntpc-time-embassy = "0.6.0"
sntpc = { version = "0.11.0", default-features=false }
sntpc-net-embassy = "0.11.0"
jiff = { version = "0.2.42", default-features=false, features = [
  "defmt",
  "alloc"
] }
embedded-tls = { version = "0.19.0", default-features=false, features = ["defmt", "alloc", "rustpki", "rsa", "p384"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
rand_core = "0.6.4"
# Fixes error[E0599]: no method named `compare_exchange` found for struct `Atomic<T>` in the current scope
spin = { version = "0.9.9", default-features = false, features = ["once", "portable-atomic", "portable_atomic"] }
base64 = { version = "0.23.1", default-features = false }
sha1 = { version = "0.11.0", default-features = false }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
